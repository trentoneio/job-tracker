services:
  job-tracker:
    build: .
    ports:
      - "${PORT:-8090}:8000"
    volumes:
      # All paths are relative to the repo root, so this works identically
      # under WSL / Docker Desktop and on a Raspberry Pi.
      - ./data:/app/data
    restart: unless-stopped
    # The slim base image ships no curl, so the healthcheck uses the stdlib.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
