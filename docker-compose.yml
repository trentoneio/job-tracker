services:
  job-tracker:
    build: .
    ports:
      - "${PORT:-8090}:8000"
    volumes:
      # All paths relative to the repo root — identical on WSL (Docker
      # Desktop) and on the Raspberry Pi (§2, §8).
      - ./data:/app/data
    restart: unless-stopped
    # Slim image has no curl, so probe with the Python stdlib (§8).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
